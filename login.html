<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parent Login | BrightPath</title>
  <meta name="description" content="Sign in to your BrightPath parent portal to view homework completion, attendance records, and tutor notes." />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body style="background-color: var(--bg-primary);">

  <div class="auth-viewport">
    <!-- TOP CONTROLS — SITS IN TOP PADDING AREA OUTSIDE AUTH CARD -->
    <div class="auth-top-controls" id="authControls">
      <button type="button" class="icon-circle-btn js-theme-toggle" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button type="button" class="icon-circle-btn js-rtl-toggle" aria-label="Toggle Direction" title="Toggle LTR/RTL Layout">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
      </button>
    </div>

    <div class="auth-card" id="loginCard">
      
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="logo-icon" style="width:36px; height:36px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <path d="m9 10 2 2 4-4"></path>
            </svg>
          </div>
          <div class="logo-text" style="text-align:start;">
            <span class="logo-name" style="font-size:1.2rem;">BRIGHTPATH</span>
            <span class="logo-sub" style="font-size:0.6rem;">AFTER-SCHOOL LEARNING</span>
          </div>
        </a>

        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your parent learning portal.</p>
      </div>

      <!-- Error Alert Container -->
      <div class="alert-box alert-error" id="loginError"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input 
            type="email" 
            id="loginEmail" 
            class="form-input" 
            placeholder="parent@example.com" 
            value="parent@example.com"
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="loginPassword" 
              class="form-input" 
              placeholder="Enter your password" 
              value="demo123"
              required 
              autocomplete="current-password"
            />
            <button type="button" class="password-toggle js-password-toggle" aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">SIGN IN</button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <div class="social-btns">
        <button type="button" class="social-btn" onclick="window.location.href='dashboard.html'">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google
        </button>
        <button type="button" class="social-btn" onclick="window.location.href='dashboard.html'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.66-.8 1.11-1.92.99-3.04-.96.04-2.12.64-2.81 1.44-.61.71-1.14 1.86-.99 2.96 1.07.08 2.15-.55 2.81-1.36z"/></svg>
          Apple
        </button>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create Account</a>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    // Forgot Password Modal interaction
    document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Password reset instructions sent to parent@example.com (Demo)');
    });
  </script>
</body>
</html>
